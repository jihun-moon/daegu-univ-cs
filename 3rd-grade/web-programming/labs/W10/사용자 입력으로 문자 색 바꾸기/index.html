<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM - 문자 색 바꾸기</title>
    <style>
        /* 과제 예시 화면과 비슷하게 꾸미기 위한 스타일입니다.
            필수 조건은 아닙니다.
        */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            margin: 20px;
        }
        h1 {
            font-size: 2.5em; /* <h1> 태그 글자 크기 */
        }
        input[type="text"] {
            font-size: 1.1em;
            padding: 5px;
            width: 200px;
        }
        button {
            font-size: 1.1em;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <h1>
        <span style="color:red">Change</span> 
        <span style="color:brown">Colors</span>
    </h1>

    <hr> <button>Start</button>
    
    <input type="text" onkeyup="changeColor(this)">

    <script>
        // changeColor 함수 정의
        function changeColor(inputElement) {
            
            // 1. <input> 태그에 입력된 값(색상 이름 또는 코드)을 가져옵니다.
            let newColor = inputElement.value;

            // 2. <h1> 태그 안의 모든 <span> 태그를 선택합니다.
            //    (querySelectAll은 모든 <span> 태그를 배열처럼 가져옵니다)
            let spans = document.querySelectorAll('h1 span');

            // [과제 조건 ②]
            // 3. 각 <span> 태그의 색상을 입력값(newColor)으로 변경합니다.
            //    (forEach를 사용해 <span> 개수만큼 반복 실행)
            spans.forEach(function(span) {
                span.style.color = newColor;
            });

            // [과제 조건 ③]
            // newColor 변수에 'red', 'aqua' 같은 이름이나
            // '#f94798' 같은 16진수 코드가 들어가도
            // span.style.color는 모두 알아서 처리해 줍니다.
        }
    </script>

</body>
</html>
